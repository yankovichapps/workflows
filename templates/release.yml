# Copy to <repo>/.github/workflows/release.yml and replace <sha> with the
# commit of yankovichapps/workflows to use (Dependabot keeps it updated).
name: Release

on:
  workflow_run:
    workflows: [CI] # the name of the repository's CI workflow
    types: [completed]
    branches: [main]
  release:
    types: [prereleased, released]
  # Sent by Xcode Cloud after archiving a release tag (ci_post_xcodebuild.sh)
  repository_dispatch:
    types: [ios-uploaded]
  # Manual iOS submission, e.g. when the Xcode Cloud dispatch failed
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. keep-an-eye@3.9.0'
        required: true
      build-number:
        description: 'Xcode Cloud build number (empty: the newest build of the version)'
        required: false

permissions: {}

jobs:
  draft:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    permissions:
      contents: write
    uses: yankovichapps/workflows/.github/workflows/release-draft.yml@<sha> # v1

  # pre-release → Play internal; release → promote the tested internal
  # release to production, or build for production when there is none
  android:
    if: github.event_name == 'release'
    permissions:
      contents: read
      id-token: write
    uses: yankovichapps/workflows/.github/workflows/release-android.yml@<sha> # v1

  # Xcode Cloud uploads to TestFlight by itself; this submits for review when
  # the release is not a pre-release (after the upload, or on unticking)
  ios:
    if: >-
      github.event_name == 'repository_dispatch' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && github.event.action == 'released')
    permissions:
      contents: read
      id-token: write
    uses: yankovichapps/workflows/.github/workflows/ios-submit.yml@<sha> # v1
    with:
      tag: ${{ inputs.tag }}
      build-number: ${{ inputs.build-number }}
