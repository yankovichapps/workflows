# Job to add to the code repository's CI workflow (next to lint/test). Runs
# only for Expo apps whose config, dependencies or native folders changed
# (nx affected). Pin the actions like the rest of CI.
  prebuild-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@<sha>
        with:
          fetch-depth: 0 # nx affected compares with the last green main
          persist-credentials: false
      - uses: pnpm/action-setup@<sha>
      - uses: actions/setup-node@<sha>
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@<sha>
      - run: pnpm exec nx affected -t prebuild-check
