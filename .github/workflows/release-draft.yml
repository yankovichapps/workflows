# Creates or updates one draft GitHub Release per app, named and tagged
# `<app>@<next version>`, from the conventional commits since the app's last
# tag. Publishing a draft (by a person) creates the tag and starts the release.
#
# The drafts are written by the org's release bot App
# (yankovichapps-release-bot), not by github-actions[bot]: Xcode Cloud did not
# start on tags made by publishing drafts that github-actions[bot] created.
# The job authenticates through WIF as the `release-bot` service account
# (bound to the calling repository's main branch and tags), reads the bot key
# from Secret Manager in the shared GCP project and mints an installation token
# limited to the calling repository and Contents: write. It does so only after
# the repository's own code (Nx) has run, so that code never sees the token.
#
# The calling repository provides the repository variables
# GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SHARED_PROJECT_ID,
# GCP_RELEASE_BOT_SERVICE_ACCOUNT, SECRET_RELEASE_BOT_PRIVATE_KEY and
# RELEASE_BOT_CLIENT_ID, and the release bot App is installed on it.
#
# Call it after CI succeeded on the default branch, see templates/release.yml.
name: Release draft

on:
  workflow_call:
    inputs:
      sha:
        description: 'Commit to draft from. Default: the commit CI ran on (workflow_run), else github.sha'
        type: string
        required: false
        default: ''
      app-tag:
        description: 'Nx tag that marks the apps released through this flow'
        type: string
        required: false
        default: 'release'
      node-version:
        description: 'Node.js version used to run Nx'
        type: string
        required: false
        default: '24'

jobs:
  draft:
    name: Draft releases
    # Defense in depth: when called from workflow_run, only for CI runs started by
    # a push (a merge), never by a pull request, whose head branch could be a
    # fork's "main".
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read # drafts are written with the release bot's token
      id-token: write # WIF: impersonate the release-bot service account
    concurrency:
      group: release-draft-${{ github.repository }}
      cancel-in-progress: true
    steps:
      - name: Resolve commit
        id: commit
        env:
          INPUT_SHA: ${{ inputs.sha }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_SHA: ${{ github.sha }}
        run: echo "sha=${INPUT_SHA:-${WORKFLOW_RUN_SHA:-${EVENT_SHA}}}" >> "${GITHUB_OUTPUT}"

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.commit.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # This reusable workflow's own scripts, at exactly the commit the caller pinned
      - name: Check out release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-tooling
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      # Only Nx's project graph is needed: no lifecycle scripts, no native builds
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Compute next versions
        env:
          APP_TAG: ${{ inputs.app-tag }}
          HEAD_SHA: ${{ steps.commit.outputs.sha }}
          NX_DAEMON: 'false'
        run: |
          APPS="$(pnpm exec nx show projects --projects "tag:${APP_TAG}" --json)"
          echo "Apps: ${APPS}"
          pnpm exec nx graph --file="${RUNNER_TEMP}/graph.json"
          node .release-tooling/scripts/release/next-version.mjs \
            --apps "${APPS}" \
            --graph "${RUNNER_TEMP}/graph.json" \
            --head "${HEAD_SHA}" \
            --repository "${GITHUB_REPOSITORY}" \
            > "${RUNNER_TEMP}/versions.json"
          cat "${RUNNER_TEMP}/versions.json"

      - name: Check the release bot variables
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SHARED_PROJECT_ID: ${{ vars.GCP_SHARED_PROJECT_ID }}
          GCP_RELEASE_BOT_SERVICE_ACCOUNT: ${{ vars.GCP_RELEASE_BOT_SERVICE_ACCOUNT }}
          SECRET_RELEASE_BOT_PRIVATE_KEY: ${{ vars.SECRET_RELEASE_BOT_PRIVATE_KEY }}
          RELEASE_BOT_CLIENT_ID: ${{ vars.RELEASE_BOT_CLIENT_ID }}
        run: |
          MISSING=()
          for NAME in GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SHARED_PROJECT_ID \
            GCP_RELEASE_BOT_SERVICE_ACCOUNT SECRET_RELEASE_BOT_PRIVATE_KEY RELEASE_BOT_CLIENT_ID; do
            [[ -n "${!NAME}" ]] || MISSING+=("${NAME}")
          done
          if (( ${#MISSING[@]} > 0 )); then
            echo "::error::Missing repository variables: ${MISSING[*]} (set by the repository's infra repo)"
            exit 1
          fi

      - name: Authenticate to Google Cloud as the release bot
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_RELEASE_BOT_SERVICE_ACCOUNT }}

      - name: Read the release bot key
        id: key
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          secrets: |-
            private-key:${{ vars.GCP_SHARED_PROJECT_ID }}/${{ vars.SECRET_RELEASE_BOT_PRIVATE_KEY }}

      # Limited to the calling repository; revoked when the job ends
      - name: Mint a release bot token
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ steps.key.outputs.private-key }}
          permission-contents: write

      - name: Sync draft releases
        env:
          GITHUB_TOKEN: ${{ steps.bot.outputs.token }}
          HEAD_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          node .release-tooling/scripts/release/sync-drafts.mjs \
            --versions "${RUNNER_TEMP}/versions.json" \
            --target "${HEAD_SHA}"
